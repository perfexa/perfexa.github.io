<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Parts Comparison</title>
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #141c2b;
            --accent: #00b4d8;
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --success: #10b981;
            --danger: #ef4444;
            --card-bg: rgba(30, 41, 59, 0.8);
            --glow: 0 0 10px rgba(0, 180, 216, 0.5);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 180, 216, 0.03) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(0, 180, 216, 0.03) 0%, transparent 20%),
                linear-gradient(to bottom, var(--bg-primary), var(--bg-secondary));
        }
        
        header {
            padding: 1.5rem;
            background-color: rgba(10, 14, 23, 0.8);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(0, 180, 216, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            text-shadow: var(--glow);
        }
        
        .logo span {
            color: var(--text-primary);
        }
        
        .logo-icon {
            font-size: 1.8rem;
        }
        
        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }
        
        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
            font-size: 0.9rem;
            position: relative;
            padding: 0.25rem 0;
        }
        
        nav a:hover {
            color: var(--accent);
        }
        
        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background-color: var(--accent);
            transition: width 0.3s ease;
        }
        
        nav a:hover::after {
            width: 100%;
        }
        
        .active {
            color: var(--accent);
        }
        
        .active::after {
            width: 100%;
        }
        
        main {
            flex: 1;
            padding: 2rem 0;
        }
        
        .hero {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .hero h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, var(--text-primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .hero p {
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        /* Comparison Styles */
        .comparison-container {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .part-card {
            flex: 1;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid rgba(0, 180, 216, 0.2);
            backdrop-filter: blur(5px);
        }
        
        .part-header {
            text-align: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(0, 180, 216, 0.2);
        }
        
        .part-name {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }
        
        .part-type {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        
        .type-cpu {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success);
        }
        
        .type-gpu {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }
        
        .specs-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .specs-table tr:nth-child(even) {
            background-color: rgba(0, 180, 216, 0.05);
        }
        
        .specs-table th {
            text-align: left;
            padding: 0.75rem 0.5rem;
            color: var(--accent);
            border-bottom: 1px solid rgba(0, 180, 216, 0.2);
        }
        
        .specs-table td {
            padding: 0.75rem 0.5rem;
            border-bottom: 1px solid rgba(0, 180, 216, 0.1);
        }
        
        .spec-name {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        .spec-value {
            font-weight: bold;
        }
        
        .better {
            color: var(--success);
            font-weight: bold;
        }
        
        .worse {
            color: var(--danger);
            font-weight: bold;
        }
        
        .benchmark-section {
            margin-top: 2rem;
        }
        
        .benchmark-header {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--accent);
            border-bottom: 1px solid rgba(0, 180, 216, 0.2);
            padding-bottom: 0.5rem;
        }
        
        .add-part-container {
            margin-top: 2rem;
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid rgba(0, 180, 216, 0.2);
        }
        
        .search-wrapper {
            position: relative;
            display: flex;
            margin-top: 1rem;
        }
        
        .search-wrapper input {
            flex: 1;
            padding: 0.75rem 1rem;
            background-color: rgba(20, 28, 43, 0.8);
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 4px;
            color: var(--text-primary);
            font-size: 1rem;
        }
        
        .search-wrapper button {
            padding: 0 1.5rem;
            margin-left: 0.5rem;
            background-color: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s ease;
        }
        
        .search-wrapper button:hover {
            opacity: 0.9;
        }
        
        footer {
            background-color: rgba(10, 14, 23, 0.8);
            padding: 2rem 0;
            border-top: 1px solid rgba(0, 180, 216, 0.2);
            margin-top: 2rem;
        }
        
        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .footer-links {
            display: flex;
            gap: 1.5rem;
        }
        
        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        
        .footer-links a:hover {
            color: var(--accent);
        }
        
        .copyright {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .comparison-container {
                flex-direction: column;
            }
            
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
            
            .footer-content {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
        }
    </style>
</head>

    <script>
        // Global variables
        let partsData = { cpus: [], gpus: [] };
        let currentType = '';
        let currentParts = [];
        
        // Load parts data from JSON files
        async function loadPartsData() {
            try {
                const [cpusResponse, gpusResponse] = await Promise.all([
                    fetch('data/cpus.json'),
                    fetch('data/gpus.json')
                ]);
                
                if (!cpusResponse.ok || !gpusResponse.ok) {
                    throw new Error('Failed to load parts data');
                }
                
                partsData.cpus = await cpusResponse.json();
                partsData.gpus = await gpusResponse.json();
                
                return partsData;
            } catch (error) {
                console.error('Error loading parts data:', error);
                return { cpus: [], gpus: [] };
            }
        }
        
        // Initialize comparison
        async function initComparison() {
            // Load parts data
            await loadPartsData();
            
            // Get URL parameters
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type');
            const id = params.get('id');
            
            if (!type || !id) {
                window.location.href = 'index.html';
                return;
            }
            
            currentType = type;
            
            // Find the initial part
            const initialPart = partsData[type + 's'].find(part => part.id === id);
            if (!initialPart) {
                window.location.href = 'index.html';
                return;
            }
            
            currentParts = [initialPart];
            updateComparison();
        }
        
        // Update the comparison view
        function updateComparison() {
            const container = document.getElementById('comparison-container');
            container.innerHTML = '';
            
            currentParts.forEach(part => {
                const partCard = document.createElement('div');
                partCard.className = 'part-card';
                
                // Create header
                let headerHTML = `
                    <div class="part-header">
                        <div class="part-name">${part.name}</div>
                        <div class="part-type type-${currentType}">${currentType.toUpperCase()}</div>
                `;
                
                // Add image placeholder
                headerHTML += `
                    <div style="width: 100px; height: 100px; margin: 0.5rem auto; background-color: rgba(0,180,216,0.1); 
                                display: flex; align-items: center; justify-content: center; border-radius: 8px;">
                        ${currentType === 'cpu' ? '💻' : '🎮'}
                    </div>
                `;
                
                headerHTML += `</div>`;
                
                // Create specs table
                let specsHTML = '<table class="specs-table"><tbody>';
                
                if (currentType === 'cpu') {
                    specsHTML += `
                        <tr>
                            <td class="spec-name">Cores/Threads</td>
                            <td class="spec-value">${part.cores} / ${part.threads}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">Clock Speed</td>
                            <td class="spec-value">${part.speed}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">Cache</td>
                            <td class="spec-value">${part.cache}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">TDP</td>
                            <td class="spec-value">${part.tdp}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">Architecture</td>
                            <td class="spec-value">${part.architecture}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">Socket</td>
                            <td class="spec-value">${part.socket}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">Price</td>
                            <td class="spec-value">${part.price}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">Release Date</td>
                            <td class="spec-value">${part.release_date}</td>
                        </tr>
                    `;
                } else {
                    specsHTML += `
                        <tr>
                            <td class="spec-name">VRAM</td>
                            <td class="spec-value">${part.vram}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">Clock Speed</td>
                            <td class="spec-value">${part.speed}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">CUDA Cores</td>
                            <td class="spec-value">${part.cores.toLocaleString()}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">Bus Width</td>
                            <td class="spec-value">${part.bus_width}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">TDP</td>
                            <td class="spec-value">${part.tdp}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">Architecture</td>
                            <td class="spec-value">${part.architecture}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">Ports</td>
                            <td class="spec-value">${part.ports}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">Price</td>
                            <td class="spec-value">${part.price}</td>
                        </tr>
                        <tr>
                            <td class="spec-name">Release Date</td>
                            <td class="spec-value">${part.release_date}</td>
                        </tr>
                    `;
                }
                
                specsHTML += '</tbody></table>';
                
                // Add benchmark section if we have multiple parts
                let benchmarkHTML = '';
                if (currentParts.length > 1) {
                    benchmarkHTML = '<div class="benchmark-section">';
                    benchmarkHTML += '<div class="benchmark-header">Performance Benchmarks</div>';
                    benchmarkHTML += '<table class="specs-table"><tbody>';
                    
                    if (currentType === 'cpu') {
                        benchmarkHTML += `
                            <tr>
                                <td class="spec-name">Single-Core Score</td>
                                <td class="spec-value">${part.single_score.toLocaleString()}</td>
                            </tr>
                            <tr>
                                <td class="spec-name">Multi-Core Score</td>
                                <td class="spec-value">${part.multi_score.toLocaleString()}</td>
                            </tr>
                        `;
                    } else {
                        benchmarkHTML += `
                            <tr>
                                <td class="spec-name">3DMark Time Spy</td>
                                <td class="spec-value">${part.timespy_score.toLocaleString()}</td>
                            </tr>
                            <tr>
                                <td class="spec-name">3DMark Fire Strike</td>
                                <td class="spec-value">${part.firestrike_score.toLocaleString()}</td>
                            </tr>
                        `;
                    }
                    
                    benchmarkHTML += '</tbody></table></div>';
                }
                
                partCard.innerHTML = headerHTML + specsHTML + benchmarkHTML;
                container.appendChild(partCard);
            });
            
            // Add comparison highlights if we have 2 parts
            if (currentParts.length === 2) {
                addComparisonHighlights();
                generateComparisonSummary();
            }

// Add this new function to generate the summary
function generateComparisonSummary() {
    const part1 = currentParts[0];
    const part2 = currentParts[1];
    const container = document.getElementById('comparison-container');
    
    const summaryDiv = document.createElement('div');
    summaryDiv.className = 'comparison-summary';
    
    let summaryHTML = `
        <div class="summary-header">
            <span>⚖️</span>
            <span>Comparison Summary</span>
        </div>
        <div class="summary-content">
    `;
    
    if (currentType === 'cpu') {
        // CPU comparison points
        const coreDiff = Math.round((part1.cores - part2.cores) / part2.cores * 100);
        const threadDiff = Math.round((part1.threads - part2.threads) / part2.threads * 100);
        const singleDiff = Math.round((part1.single_score - part2.single_score) / part2.single_score * 100);
        const multiDiff = Math.round((part1.multi_score - part2.multi_score) / part2.multi_score * 100);
        
        summaryHTML += `
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'core count', part1.cores, part2.cores, 'cores')}
            </div>
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'thread count', part1.threads, part2.threads, 'threads')}
            </div>
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'single-core performance', part1.single_score, part2.single_score, 'points')}
            </div>
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'multi-core performance', part1.multi_score, part2.multi_score, 'points')}
            </div>
        `;
        
        // Determine recommendation
        const performanceScore = (singleDiff * 0.4) + (multiDiff * 0.6);
        if (performanceScore > 0) {
            summaryHTML += `
                <div class="summary-point" style="margin-top: 1rem; font-weight: bold;">
                    The ${part1.name} is our recommended choice as it offers better overall performance.
                </div>
            `;
        } else {
            summaryHTML += `
                <div class="summary-point" style="margin-top: 1rem; font-weight: bold;">
                    The ${part2.name} is our recommended choice as it offers better overall performance.
                </div>
            `;
        }
    } else {
        // GPU comparison points
        const vram1 = parseFloat(part1.vram);
        const vram2 = parseFloat(part2.vram);
        const vramDiff = Math.round((vram1 - vram2) / vram2 * 100);
        const timespyDiff = Math.round((part1.timespy_score - part2.timespy_score) / part2.timespy_score * 100);
        const firestrikeDiff = Math.round((part1.firestrike_score - part2.firestrike_score) / part2.firestrike_score * 100);
        
        summaryHTML += `
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'VRAM amount', vram1, vram2, 'GB')}
            </div>
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'Time Spy score', part1.timespy_score, part2.timespy_score, 'points')}
            </div>
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'Fire Strike score', part1.firestrike_score, part2.firestrike_score, 'points')}
            </div>
        `;
        
        // Determine recommendation
        const performanceScore = (timespyDiff * 0.6) + (firestrikeDiff * 0.4);
        if (performanceScore > 0) {
            summaryHTML += `
                <div class="summary-point" style="margin-top: 1rem; font-weight: bold;">
                    The ${part1.name} is our recommended choice for gaming as it delivers better benchmark results.
                </div>
            `;
        } else {
            summaryHTML += `
                <div class="summary-point" style="margin-top: 1rem; font-weight: bold;">
                    The ${part2.name} is our recommended choice for gaming as it delivers better benchmark results.
                </div>
            `;
        }
    }
    
    summaryHTML += `</div>`;
    summaryDiv.innerHTML = summaryHTML;
    container.appendChild(summaryDiv);
}
            // Enhanced comparison text generator
function getComparisonText(name1, name2, metric, value1, value2, unit) {
    const diff = Math.round((value1 - value2) / value2 * 100);
    const absDiff = Math.abs(diff);
    
    // Format values with units
    const formattedValue1 = unit === 'points' ? value1.toLocaleString() : value1;
    const formattedValue2 = unit === 'points' ? value2.toLocaleString() : value2;
    const unitDisplay = unit ? ` ${unit}` : '';

    if (diff > 5) { // Significant advantage
        return `
            <span style="color: var(--better-color);">${name1}</span> has a 
            <strong>${absDiff}% higher</strong> ${metric} 
            (${formattedValue1}${unitDisplay} vs ${formattedValue2}${unitDisplay})
        `;
    } else if (diff < -5) { // Significant disadvantage
        return `
            <span style="color: var(--worse-color);">${name1}</span> has a 
            <strong>${absDiff}% lower</strong> ${metric} 
            (${formattedValue1}${unitDisplay} vs ${formattedValue2}${unitDisplay})
        `;
    } else if (diff > 0) { // Slight advantage
        return `
            <span style="color: var(--better-color);">${name1}</span> has a 
            <strong>slightly higher</strong> ${metric} 
            (${formattedValue1}${unitDisplay} vs ${formattedValue2}${unitDisplay})
        `;
    } else if (diff < 0) { // Slight disadvantage
        return `
            <span style="color: var(--worse-color);">${name1}</span> has a 
            <strong>slightly lower</strong> ${metric} 
            (${formattedValue1}${unitDisplay} vs ${formattedValue2}${unitDisplay})
        `;
    } else { // Equal
        return `
            Both have <strong>identical</strong> ${metric} 
            (${formattedValue1}${unitDisplay})
        `;
    }
}

// Enhanced recommendation generator
function generateRecommendation(part1, part2, performanceScore) {
    const winner = performanceScore > 0 ? part1 : part2;
    const loser = performanceScore > 0 ? part2 : part1;
    const absScore = Math.abs(Math.round(performanceScore));
    
    let recommendationText = '';
    
    if (absScore > 20) {
        recommendationText = `The <strong>${winner.name}</strong> is <span style="color: var(--better-color);">clearly superior</span>, offering ${absScore}% better overall performance compared to the ${loser.name}.`;
    } else if (absScore > 5) {
        recommendationText = `The <strong>${winner.name}</strong> is our <span style="color: var(--better-color);">recommended choice</span> with ${absScore}% better overall performance than the ${loser.name}.`;
    } else {
        recommendationText = `The <strong>${winner.name}</strong> has a <span style="color: var(--better-color);">slight edge</span> over the ${loser.name}, but both are excellent choices.`;
    }

    return `
        <div class="summary-point" style="margin-top: 1rem;">
            <div style="font-weight: bold; color: var(--accent);">🏆 Recommendation:</div>
            <div style="margin-top: 0.5rem;">${recommendationText}</div>
        </div>
    `;
}

// Updated generateComparisonSummary function
function generateComparisonSummary() {
    const part1 = currentParts[0];
    const part2 = currentParts[1];
    const container = document.getElementById('comparison-container');
    
    const summaryDiv = document.createElement('div');
    summaryDiv.className = 'comparison-summary';
    
    let summaryHTML = `
        <div class="summary-header">
            <span>⚖️</span>
            <span>Technical Comparison</span>
        </div>
        <div class="summary-content">
    `;
    
    if (currentType === 'cpu') {
        // Calculate performance differences
        const coreDiff = Math.round((part1.cores - part2.cores) / part2.cores * 100);
        const threadDiff = Math.round((part1.threads - part2.threads) / part2.threads * 100);
        const clockDiff = Math.round(
            (parseFloat(part1.speed) - parseFloat(part2.speed)) / 
            parseFloat(part2.speed) * 100
        );
        const singleDiff = Math.round((part1.single_score - part2.single_score) / part2.single_score * 100);
        const multiDiff = Math.round((part1.multi_score - part2.multi_score) / part2.multi_score * 100);
        
        // Weighted performance score (40% single, 60% multi)
        const performanceScore = (singleDiff * 0.4) + (multiDiff * 0.6);
        
        summaryHTML += `
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'core count', part1.cores, part2.cores, 'cores')}
            </div>
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'thread count', part1.threads, part2.threads, 'threads')}
            </div>
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'clock speed', 
                    parseFloat(part1.speed), parseFloat(part2.speed), 'GHz')}
            </div>
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'single-core score', 
                    part1.single_score, part2.single_score, 'points')}
            </div>
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'multi-core score', 
                    part1.multi_score, part2.multi_score, 'points')}
            </div>
            ${generateRecommendation(part1, part2, performanceScore)}
        `;
    } else {
        // GPU comparison points
        const vram1 = parseFloat(part1.vram);
        const vram2 = parseFloat(part2.vram);
        const vramDiff = Math.round((vram1 - vram2) / vram2 * 100);
        const clockDiff = Math.round(
            (parseFloat(part1.speed) - parseFloat(part2.speed)) / 
            parseFloat(part2.speed) * 100
        );
        const timespyDiff = Math.round((part1.timespy_score - part2.timespy_score) / part2.timespy_score * 100);
        const firestrikeDiff = Math.round((part1.firestrike_score - part2.firestrike_score) / part2.firestrike_score * 100);
        
        // Weighted performance score (60% Time Spy, 40% Fire Strike)
        const performanceScore = (timespyDiff * 0.6) + (firestrikeDiff * 0.4);
        
        summaryHTML += `
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'VRAM amount', vram1, vram2, 'GB')}
            </div>
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'clock speed', 
                    parseFloat(part1.speed), parseFloat(part2.speed), 'GHz')}
            </div>
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'Time Spy score', 
                    part1.timespy_score, part2.timespy_score, 'points')}
            </div>
            <div class="summary-point">
                ${getComparisonText(part1.name, part2.name, 'Fire Strike score', 
                    part1.firestrike_score, part2.firestrike_score, 'points')}
            </div>
            ${generateRecommendation(part1, part2, performanceScore)}
        `;
    }
    
    summaryHTML += `</div>`;
    summaryDiv.innerHTML = summaryHTML;
    container.appendChild(summaryDiv);
}
        }
        
        // Add comparison highlights between two parts
        function addComparisonHighlights() {
            const part1 = currentParts[0];
            const part2 = currentParts[1];
            const tables = document.querySelectorAll('.specs-table');
            
            // Compare basic specs
            if (currentType === 'cpu') {
                compareValues(tables, 'Cores/Threads', 
                    `${part1.cores} / ${part1.threads}`, 
                    `${part2.cores} / ${part2.threads}`,
                    part1.cores > part2.cores);
                    
                compareValues(tables, 'Clock Speed', part1.speed, part2.speed,
                    parseFloat(part1.speed) > parseFloat(part2.speed));
                    
                compareValues(tables, 'Cache', part1.cache, part2.cache,
                    parseFloat(part1.cache) > parseFloat(part2.cache));
                    
                compareValues(tables, 'Single-Core Score', 
                    part1.single_score.toLocaleString(), 
                    part2.single_score.toLocaleString(),
                    part1.single_score > part2.single_score);
                    
                compareValues(tables, 'Multi-Core Score', 
                    part1.multi_score.toLocaleString(), 
                    part2.multi_score.toLocaleString(),
                    part1.multi_score > part2.multi_score);
            } else {
                compareValues(tables, 'VRAM', part1.vram, part2.vram,
                    parseFloat(part1.vram) > parseFloat(part2.vram));
                    
                compareValues(tables, 'Clock Speed', part1.speed, part2.speed,
                    parseFloat(part1.speed) > parseFloat(part2.speed));
                    
                compareValues(tables, 'CUDA Cores', 
                    part1.cores.toLocaleString(), 
                    part2.cores.toLocaleString(),
                    part1.cores > part2.cores);
                    
                compareValues(tables, '3DMark Time Spy', 
                    part1.timespy_score.toLocaleString(), 
                    part2.timespy_score.toLocaleString(),
                    part1.timespy_score > part2.timespy_score);
                    
                compareValues(tables, '3DMark Fire Strike', 
                    part1.firestrike_score.toLocaleString(), 
                    part2.firestrike_score.toLocaleString(),
                    part1.firestrike_score > part2.firestrike_score);
            }
        }
        
        // Helper function to compare values in two tables
        function compareValues(tables, specName, value1, value2, isFirstBetter) {
            const rows1 = tables[0].querySelectorAll('tr');
            const rows2 = tables[1].querySelectorAll('tr');
            
            for (let i = 0; i < rows1.length; i++) {
                const cells1 = rows1[i].querySelectorAll('td');
                const cells2 = rows2[i].querySelectorAll('td');
                
                if (cells1.length >= 2 && cells1[0].textContent.includes(specName)) {
                    if (isFirstBetter) {
                        cells1[1].classList.add('better');
                        cells2[1].classList.add('worse');
                    } else {
                        cells1[1].classList.add('worse');
                        cells2[1].classList.add('better');
                    }
                    break;
                }
            }
        }
        
        // Update the addPart function to show results properly

        async function addPart() {
            const query = document.getElementById('add-part').value.trim();
            if (!query) return;
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = ''
            // Show loading state
            resultsDiv.innerHTML = '<div style="padding: 1rem; color: var(--text-secondary);">Searching...</div>';
            resultsDiv.style.display = 'block';
            // Ensure parts are loaded
            if (partsData[currentType + 's'].length === 0) {
                await loadPartsData();
            }
            const allParts = partsData[currentType + 's'];
            const matches = allParts.filter(part => part.name.toLowerCase().includes(query.toLowerCase()) &&
                !currentParts.some(p => p.id === part.id)
                                           );
            if (matches.length === 0) {
                resultsDiv.innerHTML = '<div style="padding: 1rem; color: var(--text-secondary);">No matching parts found</div>';
                return;
            }
            // Show results with better styling
                resultsDiv.innerHTML = matches.map(part => `
                <div class="result-item" onclick="selectPart('${part.id}')" 
                style="padding: 0.75rem; margin: 0.25rem 0; border-radius: 4px;
                    background: rgba(0,180,216,0.1); cursor: pointer;
                    transition: background 0.2s ease;">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <div style="width: 30px; height: 30px; background-color: rgba(0,180,216,0.2); 
                            display: flex; align-items: center; justify-content: center; 
                            border-radius: 4px; font-size: 1.1rem;">
                    ${currentType === 'cpu' ? '💻' : '🎮'}
                </div>
                <div>
                    <div style="font-weight: bold;">${part.name}</div>
                    <div style="font-size: 0.85rem; color: var(--text-secondary);">
                        ${currentType === 'cpu' ? 
                            `${part.cores}C/${part.threads}T • ${part.speed}` : 
                            `${part.vram} • ${part.speed}`}
                    </div>
                </div>
            </div>
        </div>
        `).join('');
    
        }
        
        // Select a part from search results
        function selectPart(id) {
            const part = partsData[currentType + 's'].find(p => p.id === id);
            if (part) {
                currentParts.push(part);
                updateComparison();
                document.getElementById('add-part').value = '';
                document.getElementById('search-results').style.display = 'none';
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initComparison);
    </script>
</body>
