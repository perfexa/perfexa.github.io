<!DOCTYPE html>
<html>
<head>
    <title>PC Parts Comparison Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>PC Parts Comparison Tool</h1>
    
    <div class="selection">
        <h2>Select CPUs to Compare</h2>
        <select id="cpu1">
            <option value="i9-13900K">Intel Core i9-13900K</option>
            <option value="r9-7950X">AMD Ryzen 9 7950X</option>
        </select>
        <select id="cpu2">
            <option value="i7-13700K">Intel Core i7-13700K</option>
            <option value="r7-7700X">AMD Ryzen 7 7700X</option>
        </select>
        
        <h2>Select GPUs to Compare</h2>
        <select id="gpu1">
            <option value="rtx4090">NVIDIA RTX 4090</option>
            <option value="rx7900xtx">AMD RX 7900 XTX</option>
        </select>
        <select id="gpu2">
            <option value="rtx4080">NVIDIA RTX 4080</option>
            <option value="rx7900xt">AMD RX 7900 XT</option>
        </select>
        
        <button onclick="compareParts()">Compare Now</button>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
